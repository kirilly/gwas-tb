[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tb-gwas"
version = "0.1.0"
description = "Genome-Wide Association Study for TB drug resistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "biopython>=1.81",
    "h5py>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "pyseer>=1.3",
    "abess>=0.4",
    "torch>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Line too long
    "N806",  # Variable in function should be lowercase (scientific convention: X, W, K)
    "F841",  # Local variable assigned but never used (intermediate vars for readability)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # numpy returns Any, not useful for scientific code
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
