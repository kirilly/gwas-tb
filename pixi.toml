[workspace]
name = "tb-gwas"
version = "0.1.0"
description = "Genome-Wide Association Study for TB drug resistance"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-64", "linux-64"]  # osx-arm64 uses Rosetta for glmnet_py

[tasks]
test = "pytest tests/"
lint = "ruff check ."
typecheck = "mypy src/"
format = "ruff format ."
run = "python scripts/run_pipeline.py"

[dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.0"
numpy = ">=1.24"
scipy = ">=1.11"
scikit-learn = ">=1.3"
matplotlib = ">=3.7"
seaborn = ">=0.12"
biopython = ">=1.81"
h5py = ">=3.9"
pyyaml = ">=6.0"
tqdm = ">=4.65"
fasttree = ">=2.1"
joblib = ">=1.3"
pyseer = ">=1.4"

[pypi-dependencies]
abess = ">=0.4"
statsmodels = ">=0.14"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
mypy = ">=1.5"
ruff = ">=0.1"
ipython = ">=8.14"

[environments]
default = { features = ["dev"], solve-group = "default" }
