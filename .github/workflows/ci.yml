name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.2

      # 1. Lint first (fastest, catches style issues early)
      - name: Lint (ruff check)
        run: pixi run ruff check src/ tests/

      - name: Format check (ruff format)
        run: pixi run ruff format --check src/ tests/

      # 2. Type check (catches type errors before runtime)
      - name: Type check (mypy)
        run: pixi run mypy src/

      # 3. Unit tests (fast, isolated tests)
      - name: Unit tests
        run: pixi run pytest tests/ -v --tb=short --ignore=tests/test_integration.py

      # 4. Integration tests (slower, end-to-end tests)
      - name: Integration tests
        run: pixi run pytest tests/test_integration.py -v --tb=short
